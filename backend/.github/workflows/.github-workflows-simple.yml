name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Create test environment file
        working-directory: ./backend
        run: |
          echo "NODE_ENV=test" >> .env.test
          echo "MONGO_TEST_URI=mongodb://localhost:27017/constellation-tracker-test" >> .env.test
          echo "JWT_SECRET=test-jwt-secret-for-github-actions" >> .env.test
          echo "JWT_EXPIRES_IN=1d" >> .env.test
          echo "JWT_COOKIE_EXPIRES_IN=1" >> .env.test
          echo "FRONTEND_URL=http://localhost:5173" >> .env.test
          echo "SENDGRID_API_KEY=test-key" >> .env.test
          echo "SENDGRID_FROM_EMAIL=test@example.com" >> .env.test

      - name: Wait for MongoDB
        run: |
          until mongosh --eval "db.runCommand({ ping: 1 })" > /dev/null 2>&1; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB is ready!"

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage
        continue-on-error: true