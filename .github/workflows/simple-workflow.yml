name: Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main
      - devel
  push:
    branches:
      - main
      - devel

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Create test environment file
        working-directory: ./backend
        run: |
          echo "NODE_ENV=test" >> .env.test
          echo "MONGO_TEST_URI=mongodb://localhost:27017/constellation-tracker-test" >> .env.test
          echo "JWT_SECRET=test-jwt-secret-for-github-actions" >> .env.test
          echo "JWT_EXPIRES_IN=1d" >> .env.test
          echo "JWT_COOKIE_EXPIRES_IN=1" >> .env.test
          echo "FRONTEND_URL=http://localhost:5173" >> .env.test
          echo "SENDGRID_API_KEY=SG.test-key" >> .env.test
          echo "SENDGRID_FROM_EMAIL=test@example.com" >> .env.test

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is ready!"
              sleep 2
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage
        continue-on-error: true
